version: "3.9"

services:
  db:
    image: postgres:16
    container_name: nutribase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutribase
      POSTGRES_PASSWORD: nutribase
      POSTGRES_DB: nutribase_db
    ports:
      - "5432:5432"
    volumes:
      - nutribase_pgdata:/var/lib/postgresql/data

volumes:
  nutribase_pgdata:
